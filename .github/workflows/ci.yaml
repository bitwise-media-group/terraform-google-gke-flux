# Continuous integration — thin caller for the org's reusable ci workflow. It
# discovers the canonical tasks this repo defines and runs `mise run lint` /
# `mise run test` as one parallel job each. `lint` carries the whole
# check-mode surface — addlicense, terraform validate + tflint (root, the
# modules/* it calls, and examples/*), terraform-docs --output-check,
# markdownlint, prettier --check, shell and workflow lint (actionlint + zizmor)
# — and `test` runs `terraform test` (plan-time, mocked providers) for every
# configuration with a test suite. All pinned tools come from the toolchain
# submodule at .mise/.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
    contents: read

jobs:
    ci:
        uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@8b34c6fe87a61fc2f800876e9268bc1da8635e88 # v8.0.0
