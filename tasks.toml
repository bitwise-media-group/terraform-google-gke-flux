#
# Repo-local tasks, included after the toolchain's terraform archetype. The
# archetype covers fmt, docs and a {{cwd}}-scoped lint (validate + tflint of
# the root module, which reaches the local modules/* through its module
# calls). This repo is a published module with examples, so it adds:
#   - lint: the archetype's rollup with license-check first (as common's
#     lint does) plus the examples/* validate + tflint pass and the
#     terraform-docs --output-check;
#   - test: a fan-out over every configuration with a plan-time test suite,
#     run by the ci/pr rollups.
# Task merging is whole-task replacement, so each redefinition repeats the
# archetype's rollup and appends this repo's steps.

# Every examples/* configuration: backend-less init, validate and tflint,
# attempted even when one fails (failures are collected and reported at the
# end). The examples carry no state or secrets, so terraform runs directly
# rather than through tf-run.sh.
[tf-lint-examples]
hide = true
dir = "{{config_root}}"
run = """
failed=""
for dir in examples/*; do
  [ -d "$dir" ] || continue
  echo "==> $dir"
  { {{vars.terraform_binary}} -chdir="$dir" init -backend=false -input=false > /dev/null \
      && {{vars.terraform_binary}} -chdir="$dir" validate \
      && tflint --chdir="$dir" --config "{{config_root}}/.tflint.hcl"; } || failed="$failed $dir"
done
[ -z "$failed" ] || { echo "FAIL:$failed"; exit 1; }
"""

# Fails when a README's generated terraform-docs block is stale (driven by
# .terraform-docs.yml: the root README and each modules/* README).
[tf-docs-check]
hide = true
dir = "{{config_root}}"
run = "terraform-docs --output-check ."

[lint]
description = "license + terraform validate/tflint (root and examples/*) + terraform-docs check + prose, container, shell and workflow checks"
run = [
  { task = "license-check" },
  { task = "tf-lint" },
  { task = "lint-containers" },
  { task = "lint-shell" },
  { task = "lint-workflows" },
  { task = "lint-prose" },
  { task = "tf-lint-examples" },
  { task = "tf-docs-check" },
]

# Configurations with a terraform test suite (plan-time, mocked providers).
# Hidden helper: the single source of truth for the test loop below.
[test-dirs]
hide = true
quiet = true
run = """
echo .
for dir in modules/*/tests; do
  if [ -d "$dir" ]; then echo "${dir%/tests}"; fi
done
"""

# Every directory is attempted even when one fails; results are summarized at
# the end. No set -e: per-directory failures are collected, and the final test
# provides the exit status.
[test]
description = "terraform test for every configuration with a test suite"
run = """
failed=""
for dir in $(mise run test-dirs); do
  echo "==> $dir"
  { terraform -chdir="$dir" init -backend=false -input=false > /dev/null \
      && terraform -chdir="$dir" test; } || failed="$failed $dir"
done
echo "==> summary"
for dir in $(mise run test-dirs); do
  case " $failed " in
    *" $dir "*) echo "  FAIL  $dir" ;;
    *) echo "  ok    $dir" ;;
  esac
done
[ -z "$failed" ]
"""

[ci]
description = "the checks the reusable CI workflow runs"
run = [{ task = "lint" }, { task = "docs" }, { task = "test" }]

[pr]
description = "full local gate before a pull request"
run = [{ task = "fmt" }, { task = "lint" }, { task = "docs" }, { task = "test" }]
