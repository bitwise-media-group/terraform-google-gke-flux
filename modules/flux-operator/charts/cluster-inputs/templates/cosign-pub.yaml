{{- /* The signing key's public half, for keyed cosign verification: the
       flux-system OCIRepository verify patch references this Secret, and the
       stack syncs it wherever else artifacts are verified. Absent entirely in
       keyless mode. */}}
{{- if .Values.cosignPublicKey }}
apiVersion: v1
kind: Secret
metadata:
  name: cosign-pub
  namespace: {{ .Release.Namespace }}
  labels:
    patchy.internal/input: cosign-pub
type: Opaque
stringData:
  cosign.pub: {{ .Values.cosignPublicKey | quote }}
{{- end }}
