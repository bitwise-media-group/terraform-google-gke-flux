apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: {{ .Release.Namespace }}
  labels:
    platform.internal/input: cluster-vars
data:
  {{- range $key, $value := .Values.clusterVars }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
