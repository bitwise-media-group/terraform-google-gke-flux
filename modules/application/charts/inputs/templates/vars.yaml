{{- /* The <name>-vars ConfigMap: the application's own substitution values,
       read beside cluster-vars by its Kustomization (postBuild.substituteFrom,
       optional). Same name and label as the cluster-inputs chart renders for
       an application seeded from the cluster root, so the Kustomization
       cannot tell the two apart. */}}
{{- with .Values.vars }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "name is required" $.Values.name }}-vars
  namespace: {{ $.Release.Namespace }}
  labels:
    platform.internal/input: application-vars
data:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
