apiVersion: v2
name: application
description: >-
  Bootstrap-only seed for one application manifest image: the
  ResourceSetInputProvider and ResourceSet (both named <name>-manifests) that
  resolve the newest tag in range, verify the image and apply it as
  Kustomization <name>. The image ships the same two objects under flux/ and
  owns them from its first reconcile.
type: application
version: 0.1.0
