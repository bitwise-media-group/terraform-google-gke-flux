{{- /* Resolves the newest image tag in the semver range, narrowed by
       includeTag when set, and exports {id, tag, digest} to the
       ResourceSet. No tag moves: a channel is its newest immutable build
       (<base>-edge.<UTC yyyymmddhhmmss>.g<short commit>, say), a semver
       pre-release the range >=0.0.0-0 admits, sorts by time and limit 1
       takes; includeTag keeps the range to that channel's builds. The
       prune: disabled label is essential for a cluster root's applications:
       the image ships an identical copy under flux/ and its own
       Kustomization adopts this object, so it must never be able to prune
       its own parent should a release drop that copy. modules/application
       keeps this object under terraform, and its images ship no copy. */}}
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: {{ required "name is required" .Values.name }}-manifests
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: application-seed
    kustomize.toolkit.fluxcd.io/prune: disabled
  annotations:
    fluxcd.controlplane.io/reconcileEvery: {{ .Values.interval | quote }}
spec:
  type: {{ .Values.tagProvider }}
  url: {{ .Values.url | quote }}
  {{- with .Values.pullSecret }}
  secretRef:
    name: {{ . }}
  {{- end }}
  filter:
    semver: {{ .Values.semver | quote }}
    {{- with .Values.includeTag }}
    includeTag: {{ . | quote }}
    {{- end }}
    limit: 1
