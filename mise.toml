#
# terraform-google-gke-flux consumes the shared toolchain
# (bitwise-media-group/toolchain) as the .mise/ submodule: mise loads its
# config.toml natively as .mise/config.toml (pinned tools -- terraform,
# tflint, terraform-docs, prettier, ... -- and the [vars] knob defaults), and
# this file selects the task files: common/ plus the terraform archetype. The
# Makefile is a thin forwarder (.mise/archetypes/terraform/include.mk). There
# is nothing to pin here: this repo's Renovate workflow bumps the submodule
# tag, which carries every tool pin and its mise.lock.

[task_config]
# Repo-local tasks live in tasks.toml, included AFTER the archetype so its
# lint/ci/pr rollups (examples/* + terraform-docs checks, the `test` fan-out)
# replace the archetype's.
includes = [
  ".mise/common/tasks.toml",
  ".mise/archetypes/terraform/tasks.toml",
  "tasks.toml",
]
